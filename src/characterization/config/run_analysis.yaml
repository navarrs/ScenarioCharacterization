defaults:
  - _self_
  - run_processor.yaml
  - override viz: scenario

# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Shared Parameters
# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

# Data paths
scores_path: ${paths.cache_path}/scores
features_path: ${paths.cache_path}/features
meta_path: ./meta/${paths.dataset_name}

# Output
output_dir: ${paths.cache_path}/analysis
add_timestamp: true
exp_tag: ""
dpi: 300

# Scenario filtering (shared by feature and score analysis scripts)
scenario_types:
  - gt
  # - ho # NOTE: currently not supported.
criteria:
  # - critical_categorical
  - critical_continuous
scores:
  - individual
  - interaction
  - safeshift
total_scenarios: null

# Multi-dataset analysis. When set, each entry requires {label, dataset_name}.
# All datasets use the same top-level scenario_types and criteria.
# Per-dataset paths (features_path, scores_path) are derived by substituting dataset_name into
# the existing path templates. Used by run_feature_analysis.py, run_score_analysis.py, and
# run_dataset_analysis.py.
# Example:
#   datasets:
#     - label: Waymo
#       dataset_name: waymo
#     - label: nuScenes
#       dataset_name: nuscenes
datasets: null

# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Feature Analysis
# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

show_kde: false
show_percentiles: true
show_colored_by_agent_type: true # If false, it will color by feature type
# Multiplier on the plot theme's font sizes. Plots are drawn at 10x6 in and then shrunk when placed in
# a document, so the text has to be oversized here to stay legible there. 1.4 puts tick labels near
# 15 pt; the previous 0.9 put them near 10 pt, which is what made the figures hard to read in the PDF.
font_scale: 1.4
# NOTE: include_pairs_with_no_vehicles is defined in run_processor.yaml so the analysis and processor steps share it.

feature_categories:
  - name: LOW
    percentile_range: [0, 25]
  - name: MEDIUM
    percentile_range: [25, 75]
  - name: HIGH
    percentile_range: [75, 90]
  - name: CRITICAL
    percentile_range: [90, 100]

# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Dataset Analysis
# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Counts exactly one scenario_types x criteria branch; counting several would count every scenario once per branch.

# Report how many scenario pickles exist under paths.scenario_base_path, to reveal scenarios that
# feature computation skipped.
count_scenarios_on_disk: true

# Types rendered in dataset_counts.tex and the plots. All types are always present in the CSV/JSON.
latex_agent_types:
  - TYPE_VEHICLE
  - TYPE_PEDESTRIAN
  - TYPE_CYCLIST
latex_pair_types:
  - TYPE_VEHICLE_VEHICLE
  - TYPE_VEHICLE_PEDESTRIAN
  - TYPE_VEHICLE_CYCLIST

# Render counts as 300k / 3.6M instead of 300,000 / 3,600,000.
latex_compact_numbers: true

# Report per-scenario median [IQR] instead of dataset totals, so pools of different sizes stay comparable
# and the right skew in these counts stays visible.
latex_per_scenario: true

# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Score Analysis
# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

tag: 'full'
test_percentile: 80 # Percentile to use to determine if holding out scenario for testing

# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Probe Analysis
# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Path to probe_summary.csv produced by run_processor with characterizer=cvm_probe.
probe_csv: ${paths.cache_path}/probes/constant_velocity/probe_summary.csv

# Multiplier on the plot theme's font sizes, separate from the feature analysis font_scale. These figures are
# authored at ~7-10 in wide and shrunk when placed in the manuscript, so the text is oversized here to stay
# legible there.
probe_font_scale: 2.0

# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# Scenario Visualization
# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

scenario_id: null  # If set, only visualize these scenarios (a single ID or a list, matched by pickle filename stem)
scenario_viz_dir: ${output_dir}/scenario_viz
scores_tag: 'gt_critical_continuous' # Either 'gt_critical_continuous' or 'ho_critical_categorical'
score_to_visualize: 'safeshift'
organize_by_percentile: false
percentiles:  # Score percentile bucket boundaries used when organize_by_percentile is true
  - 10
  - 50
  - 80
scenario_to_score_mapping_filepath: ${meta_path}/scene_to_scores_mapping.csv
probed_scenarios_path: ${paths.cache_path}/probes/constant_velocity/probed_scenarios
